name: Spring Boot Pipeline Deployment

on:
  push:
    paths:
      - ".github/workflows/backend.yml"
      - "backend/**"
    branches:
      - "main"

jobs:
  build-deploy:
    name: Build and Deploy Spring app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup java 17 and maven
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"
          cache: "maven"

      - name: generate jar with maven
        env: # to have env variables available in the tests
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          X_RAPIDAPI_KEY: ${{ secrets.X_RAPIDAPI_KEY }}
        run: |
          mvn clean package
          ls -h

      - name: setup ssh key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem
          ssh-keyscan -H ${{ secrets.AWS_SERVER_IP }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/aws_key.pem ${{secrets.AWS_SERVER_USER}}@${{secrets.AWS_SERVER_IP}} "echo 'success ssh'"

      - name: generate env file on the remote aws server
        run: |
          ssh -i ~/.ssh/aws_key.pem ${{ secrets.AWS_SERVER_USER }}@${{ secrets.AWS_SERVER_IP }} "cat > ~/footballersmarketspringbackend/.env << 'EOF'
          SPRING_DATASOURCE_URL=${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME=${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD=${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          X_RAPIDAPI_KEY=${{ secrets.X_RAPIDAPI_KEY }}
          EOF
            ls ~/footballersmarketspringbackend"
      - name: copy jar and dockerfile to aws server
        run: |
          scp -i ~/.ssh/aws_key.pem target/*.jar ${{secrets.AWS_SERVER_USER}}@${{secrets.AWS_SERVER_IP}}:~/footballersmarketspringbackend/footballersmarketapi.jar
          scp -i ~/.ssh/aws_key.pem Dockerfile ${{secrets.AWS_SERVER_USER}}@${{secrets.AWS_SERVER_IP}}:~/footballersmarketspringbackend/Dockerfile
          ssh -i ~/.ssh/aws_key.pem ${{secrets.AWS_SERVER_USER}}@${{secrets.AWS_SERVER_IP}} "ls ~/footballersmarketspringbackend"
