name: Spring Boot Pipeline Deployment

on:
  push:
    paths:
      - ".github/workflows/backend.yml"
      - "backend/**"
    branches:
      - "main"

jobs:
  build-deploy:
    name: Build and Deploy Spring app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup java 17 and maven
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "corretto"
          cache: "maven"

      - name: generate jar with maven
        env: # to have env variables available in the tests
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          mvn clean package
          ls -h
